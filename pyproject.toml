[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oncue"
version = "0.3.0"
description = "OnCue: local AI task scheduling with conversations, monitors and saved responses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["automation", "codex", "cron", "scheduler", "systemd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Repository = "https://github.com/rnagabhyrava/oncue"
Issues = "https://github.com/rnagabhyrava/oncue/issues"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
oncue = "oncue.__main__:main"
codex-local-scheduler = "oncue.__main__:main"

[tool.setuptools]
packages = ["oncue"]
include-package-data = false

[tool.setuptools.package-data]
oncue = ["static/*.html", "static/*.css", "static/*.js"]
