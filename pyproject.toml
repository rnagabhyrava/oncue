[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-local-scheduler"
version = "0.2.0"
description = "A local-first, systemd-backed scheduler for command and Codex workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["automation", "codex", "cron", "scheduler", "systemd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Repository = "https://github.com/rnagabhyrava/codex-local-scheduler"
Issues = "https://github.com/rnagabhyrava/codex-local-scheduler/issues"

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
codex-local-scheduler = "codex_local_scheduler.__main__:main"

[tool.setuptools]
packages = ["codex_local_scheduler"]
